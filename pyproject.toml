[build-system]
requires = ["hatchling>=1.27.0", "hatch-nodejs-version>=0.4.0", "jupyter-builder>=1.2.3,<2"]
build-backend = "hatchling.build"

[project]
name = "jh-vantage-theme"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Themes",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6,<5",
    "jupyter-builder>=1.2.3,<2",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jh_vantage_theme/labextension"]
exclude = [".github", "binder", "docusaurus"]

[tool.hatch.build.targets.wheel.shared-data]
"jh_vantage_theme/labextension" = "share/jupyter/labextensions/jh-vantage-theme"
"install.json" = "share/jupyter/labextensions/jh-vantage-theme/install.json"

[tool.hatch.build.hooks.version]
path = "jh_vantage_theme/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.10.0"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jh_vantage_theme/labextension/package.json",
]
skip-if-exists = ["jh_vantage_theme/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jh_vantage_theme/labextension"

[tool.check-wheel-contents]
ignore = ["W002"]
