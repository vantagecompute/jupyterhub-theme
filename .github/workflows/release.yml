# Release jh-vantage-theme from a v<version> tag: build the wheel and sdist once,
# attest their provenance, publish them to PyPI with OIDC trusted publishing and
# attach them to a GitHub release.
#
# Nothing here uses a stored token:
#   - PyPI trusts this workflow file in the `pypi` environment of this
#     repository's owner (PyPI pins repository_owner_id, which is immutable).
#   - The jobs also refuse to run anywhere but this repository, by its immutable
#     id, and only for v* tags; the `pypi` environment is restricted to v* tags.
#   - The GitHub release uses the workflow's GITHUB_TOKEN.
#
# Release with: bump "version" in package.json by pull request, merge, then tag
# the merge commit v<version> on main and push the tag.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below on the vantage-eng self-hosted runner group (X64). To widen or
# narrow that, set SELF_HOSTED_RUNS_ON to a runs-on value in JSON.
jobs:
  build:
    if: github.repository_id == 964113457 && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up Yarn (pinned by packageManager, checksum-verified)
        uses: ./.github/actions/setup-yarn

      # A self-hosted runner keeps the tool cache's Python between jobs, so
      # install into a job-local virtualenv: packages and the built wheel from
      # an earlier run must not satisfy this run's installs.
      - name: Use a job-local virtualenv
        if: runner.environment != 'github-hosted'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: |
          set -eux
          python -m pip install "jupyterlab>=4.6.5,<5" "jupyter-builder>=1.2.4,<2" build
          yarn install --immutable
          yarn lint:check
          python -m build
          (cd dist && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.repository_id == 964113457 && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    environment:
      name: pypi
      url: https://pypi.org/project/jh-vantage-theme/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/jh_vantage_theme-*'

      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [build, pypi]
    if: github.repository_id == 964113457 && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
