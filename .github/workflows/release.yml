# Release jh-vantage-theme from a v<version> tag: build the wheel and sdist once,
# attest their provenance, publish them to PyPI with OIDC trusted publishing and
# attach them to a GitHub release.
#
# Nothing here uses a stored token:
#   - PyPI trusts this workflow file in the `pypi` environment of this
#     repository's owner (PyPI pins repository_owner_id, which is immutable).
#   - The jobs also refuse to run anywhere but this repository, by its immutable
#     id, and only for v* tags; the `pypi` environment is restricted to v* tags.
#   - The GitHub release uses the workflow's GITHUB_TOKEN.
#
# Release with: bump "version" in package.json by pull request, merge, then tag
# the merge commit v<version> on main and push the tag.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_id == 964113457 && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: |
          set -eux
          python -m pip install "jupyterlab>=4.6,<5" "jupyter-builder>=1.2.3,<2" build
          jlpm install --immutable
          jlpm lint:check
          python -m build
          (cd dist && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.repository_id == 964113457 && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/jh-vantage-theme/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/jh_vantage_theme-*'

      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, pypi]
    if: github.repository_id == 964113457 && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
