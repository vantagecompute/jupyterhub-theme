name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below on the vantage-eng self-hosted runner group (X64). To widen or
# narrow that, set SELF_HOSTED_RUNS_ON to a runs-on value in JSON.
jobs:
  build:
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up Yarn (pinned by packageManager, checksum-verified)
        uses: ./.github/actions/setup-yarn

      # A self-hosted runner keeps the tool cache's Python between jobs, so
      # install into a job-local virtualenv: packages and the built wheel from
      # an earlier run must not satisfy this run's installs.
      - name: Use a job-local virtualenv
        if: runner.environment != 'github-hosted'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install the build tools
        run: python -m pip install "jupyterlab>=4.6.5,<5" "jupyter-builder>=1.2.4,<2" build

      - name: Lint
        run: |
          set -eux
          yarn install --immutable
          yarn lint:check

      - name: Build the extension
        run: yarn build:prod

      # vdeployer's notebook image builds this package from source as an
      # unprivileged user whose ~/.cache is owned by root. The build must not
      # need to write there (it did before @jupyter/builder, and that broke the
      # image). Build the wheel the way pip does in the image, with an
      # unwritable cache, to keep that regression out.
      - name: Package with an unwritable home cache
        run: |
          set -eux
          yarn clean:all
          home="$(mktemp -d)"
          mkdir -p "$home/.cache"
          chmod 555 "$home/.cache"
          HOME="$home" XDG_CACHE_HOME="$home/.cache" python -m build
          test -z "$(ls -A "$home/.cache")"

      - name: Check the wheel
        run: |
          set -eux
          python -m pip install dist/jh_vantage_theme-*.whl
          jupyter labextension list 2>&1 | grep -ie "jh-vantage-theme.*OK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install the wheel where there is no Node.js, as the notebook images do once
  # they install a released wheel instead of building from source.
  test-isolated:
    needs: build
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    permissions:
      actions: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      # A self-hosted runner keeps the tool cache's Python between jobs, so
      # install into a job-local virtualenv: packages and the built wheel from
      # an earlier run must not satisfy this run's installs.
      - name: Use a job-local virtualenv
        if: runner.environment != 'github-hosted'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist

      - name: Install and check
        run: |
          set -eux
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo rm -rf "$(command -v node)"
            sudo rm -rf "$(command -v node)" || true
          else
            # Never delete a persistent runner's Node.js: drop every PATH
            # entry that holds a node binary instead.
            PATH="$(printf '%s' "$PATH" | tr ':' '\n' | while read -r d; do [ -x "$d/node" ] || printf '%s:' "$d"; done)"
            PATH="${PATH%:}"
            if command -v node; then echo 'node is still on PATH' >&2; exit 1; fi
          fi
          python -m pip install "jupyterlab>=4,<5" jh_vantage_theme-*.whl
          jupyter labextension list 2>&1 | grep -ie "jh-vantage-theme.*OK"
          python -m jupyterlab.browser_check --no-browser-test
