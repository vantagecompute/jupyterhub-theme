# node_modules rather than Plug'n'Play: Docusaurus and its plugins expect
# packages on disk in the usual layout.
nodeLinker: node-modules

# Refuse a package version until it has been public for three days (minutes
# here), so a compromised release has time to be caught and pulled before a
# build resolves it. First-party packages are exempt: a new release of our own
# theme should be usable the day it ships.
npmMinimalAgeGate: 4320
npmPreapprovedPackages:
  - "@vantagecompute/*"

enableTelemetry: false
