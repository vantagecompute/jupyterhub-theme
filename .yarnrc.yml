nodeLinker: node-modules
enableScripts: false

# Refuse a package version until it has been public for three days (minutes
# here), so a compromised release has time to be caught and pulled before a
# build resolves it. First-party packages are exempt.
npmMinimalAgeGate: 4320
npmPreapprovedPackages:
  - "@vantagecompute/*"

enableTelemetry: false
